<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujima AI Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #101827;
      color: white;
    }

    .card {
      border-radius: 8px;
      border: none;
      color: #111;
    }

    .container {
      margin-top: 30px;
    }

    .title {
      text-align: center;
      margin-top: 24px;
      font-weight: 700;
    }

    .alert-box {
      display: none;
      background: #dc2626;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <h2 class="title">Ujima AI Bias & Fairness Dashboard</h2>

  <div class="container">
    <div id="biasAlert" class="alert-box">
      Bias detected: approval gap exceeds the review threshold.
    </div>

    <div class="row g-3">
      <div class="col-md-3">
        <div class="card p-3 h-100">
          <h5>Total Applications</h5>
          <h3 id="total">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 h-100">
          <h5>Approval Rate</h5>
          <h3 id="approval">0%</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 h-100">
          <h5>Bias Gap</h5>
          <h3 id="bias">0%</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 h-100">
          <h5>Escalations</h5>
          <h3 id="esc">0</h3>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-3">
      <div class="col-md-6">
        <div class="card p-3">
          <h5>Application Outcomes</h5>
          <canvas id="approvalChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h5>Occupation Fairness</h5>
          <canvas id="occupationChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
