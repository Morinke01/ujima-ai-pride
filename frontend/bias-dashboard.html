<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bias & Fairness Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      text-align: center;
    }

    #summary {
      text-align: center;
      margin: 0 auto 20px;
      max-width: 760px;
    }

    .alert {
      padding: 12px;
      background: #fee2e2;
      color: #991b1b;
      margin: 10px auto 20px;
      border-radius: 8px;
      display: none;
      max-width: 760px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Ujima AI Bias & Fairness Dashboard</h1>

  <p id="summary">Loading audit data...</p>

  <div id="biasAlert" class="alert">
    Bias detected: approval gap exceeds the fairness threshold.
  </div>

  <div class="grid">
    <div class="card">
      <canvas id="approvalChart"></canvas>
    </div>
    <div class="card">
      <canvas id="scoreChart"></canvas>
    </div>
  </div>

  <script src="bias-dashboard.js"></script>
</body>
</html>
